name: Release

# Push a tag vX.Y.Z: builds every platform, publishes a GitHub release with
# the raw binaries + checksums.txt (`ask-form upgrade`, the auto-upgrade in
# `ask-form serve` and install.sh all read from there), then the same
# binaries to npm (`npx ask-form`: Claude's code sandbox reaches npm only).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false # stdlib only: no go.sum to key a cache on
      - run: go vet ./... && go test ./...
      - name: Build every platform
        run: make dist VERSION="${GITHUB_REF_NAME}"
      - name: Check the stamped version
        run: test "$(./dist/ask-form-linux-amd64 version)" = "{\"version\":\"${GITHUB_REF_NAME}\"}"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/ask-form*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $pre
      # npm: ask-form + one package per platform (scripts/npm-publish.sh).
      # Trusted publishing (OIDC, id-token above) once each package trusts
      # this workflow; until then an NPM_TOKEN secret. The very first
      # publish is by hand (`npm login && scripts/npm-publish.sh vX.Y.Z
      # --trust`): a package must exist before it can trust a workflow. A
      # failure here never holds the GitHub release back.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@^11.10.0
          scripts/npm-publish.sh "$GITHUB_REF_NAME" --dist dist
