title: 'Choisissez du bout du doigt : les widgets'
description: |-
  Un `widget` est du HTML et du script écrits par l'agent qui pose la question, affichés dans une boîte verrouillée : pas de réseau, pas d'accès à cette page. Il renvoie **une seule valeur**, et cette valeur est la réponse. Essayez les trois ci-dessous ; chaque question montre le JSON qu'elle envoie.
summary: |-
  Des contrôles que l'agent dessine lui-même : glisser des idées sur une grille, toucher un écran, régler une couleur. La réponse est le JSON que renvoie le contrôle.
order: 8
sections:
  Placer:
    fields:
      how-it-works:
        type: markdown
        label: Comment ça marche
        text: |-
          L'agent écrit une petite page et appelle `askForm.setValue(value)` à chaque changement de la réponse. Ici, la grille renvoie `{ "dark-mode": {"x": 30, "y": 80}, … }`, avec `x` l'effort et `y` l'impact, tous deux de 0 à 100.
      priorities:
        type: widget
        label: Où se placent ces idées ?
        schema: object
        height: 320
        help: Effort de gauche à droite, impact de bas en haut. Les idées laissées dans le bac ne figurent pas dans la réponse.
        html: |-
          <style>
          .plane{position:relative;height:236px;border:1px solid hsl(var(--border));border-radius:10px;touch-action:none;user-select:none;-webkit-user-select:none;
           background:linear-gradient(hsl(var(--border)),hsl(var(--border))) center/1px 100% no-repeat,linear-gradient(hsl(var(--border)),hsl(var(--border))) center/100% 1px no-repeat}
          .ax{position:absolute;font-size:11px;color:hsl(var(--muted-foreground));pointer-events:none}
          .chip{display:inline-block;padding:7px 12px;border-radius:999px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));font-size:13px;cursor:grab;touch-action:none;white-space:nowrap;user-select:none;-webkit-user-select:none}
          .plane .chip{position:absolute;transform:translate(-50%,-50%)}
          .tray{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;min-height:34px}
          .hint{margin:8px 0 0;font-size:12px;color:hsl(var(--muted-foreground))}
          </style>
          <div class="plane" id="pl">
           <span class="ax" style="left:8px;top:5px">▲ fort impact</span>
           <span class="ax" style="left:8px;bottom:5px">▼ faible impact</span>
           <span class="ax" style="right:8px;bottom:5px">plus d'effort ▶</span>
           <span class="ax" style="right:8px;top:5px">difficile, rentable</span>
          </div>
          <div class="tray" id="tr"></div>
          <p class="hint">Glissez les idées sur la grille ; déposez-les à l'extérieur pour annuler.</p>
          <script>
          (function () {
            var items = [["dark-mode", "Mode sombre"], ["csv-export", "Export CSV"], ["sso", "Connexion SSO"], ["search", "Recherche plus rapide"]];
            var pl = document.getElementById("pl"), tr = document.getElementById("tr"), val = {}, chips = {};
            function clamp(n) { return Math.max(0, Math.min(100, n)); }
            function at(c, x, y) { c.style.left = x + "%"; c.style.top = (100 - y) + "%"; }
            function report() { askForm.setValue(Object.keys(val).length ? val : null); }
            function pos(e) { var r = pl.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * 100, y: 100 - (e.clientY - r.top) / r.height * 100 }; }
            function down(e) {
              var c = e.currentTarget;
              pl.appendChild(c); // moving a node drops pointer capture: capture after
              c.setPointerCapture(e.pointerId);
              var p = pos(e); at(c, clamp(p.x), clamp(p.y));
              c.onpointermove = function (ev) { var q = pos(ev); at(c, clamp(q.x), clamp(q.y)); };
              c.onpointerup = function (ev) {
                c.onpointermove = c.onpointerup = null;
                var q = pos(ev);
                if (q.x < -4 || q.x > 104 || q.y < -4 || q.y > 104) { c.removeAttribute("style"); tr.appendChild(c); delete val[c.dataset.id]; }
                else val[c.dataset.id] = { x: Math.round(clamp(q.x)), y: Math.round(clamp(q.y)) };
                report();
              };
              e.preventDefault();
            }
            items.forEach(function (it) {
              var c = document.createElement("div");
              c.className = "chip"; c.textContent = it[1]; c.dataset.id = it[0];
              c.addEventListener("pointerdown", down);
              tr.appendChild(c); chips[it[0]] = c;
            });
            askForm.onInit(function (v) {
              if (!v || typeof v !== "object") return;
              Object.keys(v).forEach(function (id) {
                if (!chips[id] || !v[id]) return;
                pl.appendChild(chips[id]); at(chips[id], clamp(v[id].x), clamp(v[id].y)); val[id] = v[id];
              });
            });
          })();
          </script>
  Pointer:
    fields:
      annoying:
        type: widget
        label: Touchez la partie de cet écran qui vous gêne le plus
        schema: string
        height: 352
        help: La réponse est le `data-id` de l'élément touché, par exemple `compose`. Touchez-le à nouveau pour effacer.
        html: |-
          <style>
          body{display:flex;justify-content:center;padding:4px 0}
          .phone{width:250px;border:1px solid hsl(var(--border));border-radius:22px;overflow:hidden;background:hsl(var(--card));position:relative;box-shadow:0 2px 10px hsl(0 0% 0%/.08)}
          [data-id]{cursor:pointer;-webkit-tap-highlight-color:transparent}
          [data-id].on{outline:2px solid hsl(var(--primary));outline-offset:-2px;background:hsl(var(--primary)/.14)}
          .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:600;background:hsl(var(--muted))}
          .search{margin:10px 12px;padding:9px 12px;border-radius:9px;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));font-size:12.5px}
          .item{margin:0 12px 8px;padding:10px 12px;border-radius:10px;border:1px solid hsl(var(--border));font-size:12.5px}
          .item small{display:block;color:hsl(var(--muted-foreground));margin-top:2px}
          .fab{position:absolute;right:12px;bottom:58px;width:42px;height:42px;border-radius:50%;background:hsl(var(--primary));color:hsl(var(--primary-foreground));display:grid;place-items:center;font-size:22px}
          .tabs{display:flex;margin-top:64px;border-top:1px solid hsl(var(--border))}
          .tabs div{flex:1;text-align:center;padding:11px 0;font-size:12px}
          </style>
          <div class="phone" id="ph">
           <div class="bar" data-id="header"><span>Boîte de réception</span><span data-id="avatar">◉</span></div>
           <div class="search" data-id="search">Rechercher des messages…</div>
           <div class="item" data-id="message-1">Facture #482<small>Aujourd'hui · 2 pièces jointes</small></div>
           <div class="item" data-id="message-2">Voyage à Lisbonne<small>Hier</small></div>
           <div class="fab" data-id="compose">+</div>
           <div class="tabs"><div data-id="tab-inbox">Réception</div><div data-id="tab-sent">Envoyés</div><div data-id="tab-settings">Réglages</div></div>
          </div>
          <script>
          (function () {
            var cur = null, ph = document.getElementById("ph");
            function show(id) {
              [].forEach.call(ph.querySelectorAll(".on"), function (n) { n.classList.remove("on"); });
              cur = id;
              var n = id && ph.querySelector('[data-id="' + id + '"]');
              if (n) n.classList.add("on");
            }
            ph.addEventListener("click", function (e) {
              var n = e.target.closest("[data-id]");
              if (!n) return;
              var id = n.getAttribute("data-id");
              show(id === cur ? null : id);
              askForm.setValue(cur);
            });
            askForm.onInit(function (v) { if (typeof v === "string") show(v); });
          })();
          </script>
  Régler:
    fields:
      brand_colour:
        type: widget
        label: Réglez la couleur d'accent
        schema: string
        default: '#3b82f6'
        help: Renvoie une chaîne `#rrggbb`, à partir de la valeur par défaut `#3b82f6`.
        html: |-
          <style>
          body{padding:2px 0}
          .sw{height:84px;border-radius:12px;border:1px solid hsl(var(--border));display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;box-sizing:border-box}
          .sw code{font:600 13px ui-monospace,Menlo,monospace;padding:3px 8px;border-radius:6px;background:rgb(255 255 255/.85);color:#111}
          .row{display:grid;grid-template-columns:22px 1fr 36px;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:hsl(var(--muted-foreground))}
          .row output{text-align:right;font-variant-numeric:tabular-nums}
          input[type=range]{width:100%;height:28px;margin:0}
          </style>
          <div class="sw" id="sw"><code id="hx"></code></div>
          <div class="row"><span>H</span><input type="range" id="h" min="0" max="360"><output id="ho"></output></div>
          <div class="row"><span>S</span><input type="range" id="s" min="0" max="100"><output id="so"></output></div>
          <div class="row"><span>L</span><input type="range" id="l" min="5" max="95"><output id="lo"></output></div>
          <script>
          (function () {
            var $ = function (i) { return document.getElementById(i); };
            function hex(h, s, l) {
              s /= 100; l /= 100;
              var a = s * Math.min(l, 1 - l);
              function f(n) { var k = (n + h / 30) % 12, c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); return ("0" + Math.round(255 * c).toString(16)).slice(-2); }
              return "#" + f(0) + f(8) + f(4);
            }
            function hsl(x) {
              var r = parseInt(x.slice(1, 3), 16) / 255, g = parseInt(x.slice(3, 5), 16) / 255, b = parseInt(x.slice(5, 7), 16) / 255;
              var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
              if (d) {
                s = d / (1 - Math.abs(2 * l - 1));
                h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
                h *= 60;
              }
              return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
            }
            function draw(send) {
              var c = hex(+$("h").value, +$("s").value, +$("l").value);
              $("sw").style.background = c; $("hx").textContent = c;
              $("ho").textContent = $("h").value; $("so").textContent = $("s").value; $("lo").textContent = $("l").value;
              if (send) askForm.setValue(c);
            }
            ["h", "s", "l"].forEach(function (i) { $(i).addEventListener("input", function () { draw(true); }); });
            askForm.onInit(function (v) {
              var p = hsl(/^#[0-9a-f]{6}$/i.test(v) ? v : "#3b82f6");
              $("h").value = p[0]; $("s").value = p[1]; $("l").value = Math.max(5, Math.min(95, p[2]));
              draw(false);
              if (/^#[0-9a-f]{6}$/i.test(v)) { $("sw").style.background = v; $("hx").textContent = v; } // show the exact value, not its HSL round trip
            });
            draw(false);
          })();
          </script>
