title: "Suivi d'habitudes : avant de générer le projet"
description: |-
  Le dépôt est vide, donc quelques choix avant de générer quoi que ce soit. J'ai pré-sélectionné ce qui correspond à ce que vous m'avez dit : une petite application pour vous et quelques amis, peu coûteuse à faire tourner. Validez une page d'un seul geste ou modifiez ce que vous voulez.
summary: |-
  Lancer un projet : stack, données, comptes, outillage et déploiement dans un seul formulaire, mes recommandations pré-sélectionnées.
order: 1
sections:
  Interface et stack:
    fields:
      home:
        type: radio
        label: Écran d'accueil
        required: true
        default: today
        help: Ce que vous voyez à l'ouverture de l'application. Une liste est le plus rapide à cocher sur téléphone.
        options:
          today:
            label: Liste du jour
            html: <div style="width:240px;height:320px;box-sizing:border-box;padding:16px 14px;background:hsl(var(--card));color:hsl(var(--foreground));font:12px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;gap:9px;"><div style="font-weight:750;font-size:16px;margin-bottom:2px">Aujourd'hui</div><div style="display:flex;gap:9px;align-items:center;border:1px solid hsl(var(--border));border-radius:9px;padding:8px 9px"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid hsl(var(--primary));background:hsl(var(--primary));display:grid;place-items:center;box-sizing:border-box"><span style="color:#fff;font-size:10px;font-weight:800">✓</span></span><b style="font-weight:600">Lire</b></div><div style="display:flex;gap:9px;align-items:center;border:1px solid hsl(var(--border));border-radius:9px;padding:8px 9px"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid hsl(var(--primary));background:hsl(var(--primary));display:grid;place-items:center;box-sizing:border-box"><span style="color:#fff;font-size:10px;font-weight:800">✓</span></span><b style="font-weight:600">Courir</b></div><div style="display:flex;gap:9px;align-items:center;border:1px solid hsl(var(--border));border-radius:9px;padding:8px 9px"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid hsl(var(--border));background:transparent;display:grid;place-items:center;box-sizing:border-box"></span><b style="font-weight:600">Eau</b></div><div style="display:flex;gap:9px;align-items:center;border:1px solid hsl(var(--border));border-radius:9px;padding:8px 9px"><span style="flex:none;width:18px;height:18px;border-radius:50%;border:2px solid hsl(var(--border));background:transparent;display:grid;place-items:center;box-sizing:border-box"></span><b style="font-weight:600">Sommeil</b></div></div>
          week:
            label: Grille de la semaine
            html: <div style="width:240px;height:320px;box-sizing:border-box;padding:16px 14px;background:hsl(var(--card));color:hsl(var(--foreground));font:12px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;gap:9px;"><div style="font-weight:750;font-size:16px;margin-bottom:2px">Cette semaine</div><div style="display:grid;grid-template-columns:44px repeat(7,1fr);gap:5px;align-items:center"><span></span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">L</span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">M</span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">M</span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">J</span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">V</span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">S</span><span style="font-size:10px;text-align:center;color:hsl(var(--muted-foreground))">D</span><span style="font-size:11px;color:hsl(var(--muted-foreground))">Lire</span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="font-size:11px;color:hsl(var(--muted-foreground))">Courir</span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="font-size:11px;color:hsl(var(--muted-foreground))">Eau</span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="font-size:11px;color:hsl(var(--muted-foreground))">Sommeil</span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--primary))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span><span style="aspect-ratio:1;border-radius:4px;background:hsl(var(--muted))"></span></div></div>
          streaks:
            label: Cartes de séries
            html: <div style="width:240px;height:320px;box-sizing:border-box;padding:16px 14px;background:hsl(var(--card));color:hsl(var(--foreground));font:12px/1.25 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;gap:9px;"><div style="font-weight:750;font-size:16px;margin-bottom:2px">Séries</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="border:1px solid hsl(var(--border));border-radius:10px;padding:9px"><div style="color:hsl(var(--primary))">🔥</div><div style="font-size:24px;font-weight:800">12</div><div style="font-size:11px;color:hsl(var(--muted-foreground))">Lire</div></div><div style="border:1px solid hsl(var(--border));border-radius:10px;padding:9px"><div style="color:hsl(var(--primary))">🔥</div><div style="font-size:24px;font-weight:800">5</div><div style="font-size:11px;color:hsl(var(--muted-foreground))">Courir</div></div><div style="border:1px solid hsl(var(--border));border-radius:10px;padding:9px"><div style="color:hsl(var(--primary))">🔥</div><div style="font-size:24px;font-weight:800">21</div><div style="font-size:11px;color:hsl(var(--muted-foreground))">Eau</div></div><div style="border:1px solid hsl(var(--border));border-radius:10px;padding:9px"><div style="color:hsl(var(--primary))">🔥</div><div style="font-size:24px;font-weight:800">3</div><div style="font-size:11px;color:hsl(var(--muted-foreground))">Sommeil</div></div></div></div>
        aspect: 3/4
      framework:
        type: radio
        label: Front-end
        required: true
        default: vite-react
        help: Un suivi d'habitudes est surtout côté client ; son API tient dans un petit serveur.
        options:
          vite-react:
            label: Vite + React
            description: 'Une SPA statique : la moins chère à héberger, la boucle de dev la plus rapide'
          next:
            label: Next.js
            description: Rendu serveur et routes d'API dans une seule application
          sveltekit: {label: SvelteKit, description: 'Moins de code par écran, bundles plus légers'}
          astro:
            label: Astro + islands
            description: Idéal quand la plupart des pages sont du contenu
      backend:
        type: radio
        label: Back-end
        required: true
        default: hono
        options:
          hono: {label: Hono sur Node, description: Un petit serveur d'API typé}
          pocketbase:
            label: PocketBase
            description: Auth, base de données et interface d'admin dans un seul binaire
          supabase:
            label: Supabase
            description: Postgres hébergé + auth, offre gratuite généreuse
      database:
        type: radio
        label: Base de données
        required: true
        default: sqlite
        help: SQLite tient les données de cette application pendant des années ; passer à Postgres plus tard revient à changer de driver avec l'ORM que j'utiliserais (Drizzle).
        options:
          sqlite: {label: SQLite, description: "Un seul fichier, sauvegardé avec l'application"}
          postgres: {label: Postgres, description: Un service séparé à faire tourner}
  Comptes et fonctionnalités:
    fields:
      auth:
        type: radio
        label: Comment les gens se connectent-ils ?
        required: true
        default: magic-link
        options:
          magic-link: {label: Lien magique par e-mail, description: Aucun mot de passe à stocker}
          oauth:
            label: Google / GitHub
            description: Un seul tap, demande des applications OAuth
          passkeys: Passkeys
          none: 'Pas de comptes : un seul tableau partagé'
      features:
        type: multiselect
        label: Que met-on dans la première version ?
        default: [streaks, share, dark]
        options:
          streaks: Séries et heatmap mensuelle
          share:
            label: Partager une habitude avec des amis
            description: Ils voient votre série, vous voyez la leur
          reminders: {label: Rappels quotidiens, description: 'Web push, nécessite la PWA'}
          dark: Mode sombre
          export: Export CSV
      offline:
        type: checkbox
        label: Fonctionne hors ligne (PWA installable, se synchronise au retour du réseau)
        default: true
  Outillage et livraison:
    fields:
      language:
        type: radio
        label: Langage
        default: ts-strict
        options: {ts-strict: 'TypeScript, strict', ts: 'TypeScript, souple', js: JavaScript}
      styling:
        type: select
        label: Style
        default: tailwind
        options:
          tailwind: Tailwind CSS
          shadcn: Tailwind + composants shadcn/ui
          css-modules: CSS modules
      tests:
        type: multiselect
        label: Tests et CI
        default: [unit, ci]
        options:
          unit: Tests unitaires (Vitest)
          e2e: Tests de bout en bout des parcours principaux (Playwright)
          ci: CI à chaque push (GitHub Actions)
      deploy:
        type: radio
        label: Où ça tourne ?
        default: fly
        options:
          fly:
            label: Fly.io
            description: Un conteneur plus un volume pour SQLite, environ 2 $/mois
          vps: Mon propre VPS, avec Docker
          local: "Nulle part pour l'instant : en local uniquement"
      scope:
        type: slider
        label: Jusqu'où pousser la première version ?
        min: 1
        max: 5
        step: 1
        default: 3
        minLabel: squelette
        maxLabel: peaufiné
        help: 1 = un squelette cliquable · 3 = les fonctionnalités ci-dessus, qui marchent, avec un look sobre · 5 = peaufiné et déployé
