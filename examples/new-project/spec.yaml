title: 'Habit tracker: before I scaffold'
description: |-
  The repo is empty, so a few choices before I generate anything. I pre-selected what fits what you told me: a small app for you and a few friends, cheap to run. Accept a page in one tap or change anything.
summary: |-
  Kick off a project: stack, data, accounts, tooling and deploy in one form, my recommendations pre-selected.
order: 1
sections:
  Look & stack:
    fields:
      home:
        type: radio
        label: Home screen
        required: true
        default: today
        help: What you see when you open the app. A list is the quickest to tick through on a phone.
