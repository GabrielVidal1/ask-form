title: 'Review of feat/invoices: 6 findings'
description: I read the 14 files `feat/invoices` changes against `main` (+612 −88). Six findings, worst first, each with the code. Pick what I fix; my call is pre-selected. I'll fix them on the branch, one commit each, and rerun the tests.
summary: |-
  Code review triage: what the agent found in a branch, worst first, with a fix / leave / later call on each.
order: 2
sections:
  Must fix:
    fields:
      1-anyone-can:
        type: markdown
        label: 1 · Anyone can read any invoice
        text: |-
          `api/invoices/[id].ts:18` loads the invoice by id and never checks it belongs to the caller's account. Any signed-in user can read every invoice by counting up ids.

          ```ts
          const invoice = await db.invoice.findUnique({ where: { id } })
          return json(invoice)
          ```

          The fix scopes the query to `session.accountId` and returns 404 otherwise, plus a test.
      f1_idor:
        type: radio
        label: What should I do?
        required: true
        default: fix
        options:
          fix: {label: Fix it, description: "Scope the query to the caller's account, add a test"}
          skip: Leave it
          issue: Open an issue for later
      2-totals-drift:
        type: markdown
        label: 2 · Totals drift by a cent
        text: |-
          `lib/totals.ts:41` rounds each line before summing, so a 3-line invoice can be 0.01 off the PDF the accountant gets.

          ```ts
          const total = lines.reduce((s, l) => s + round(l.qty * l.price), 0)
          ```
      f2_rounding:
        type: radio
        label: What should I do?
        required: true
        default: fix
        options:
          fix: {label: Fix it, description: 'Work in integer cents, round once'}
          skip: Leave it
          issue: Open an issue for later
  Worth fixing:
    fields:
      3-51-queries:
        type: markdown
        label: 3 · 51 queries per invoice list
        text: |-
          `listInvoices` loads each invoice's customer in its own query: a 50-row page makes 51 round trips (380 ms on the staging data).
      f3_n_plus_one:
        type: radio
        label: What should I do?
        required: true
        default: fix
        options:
          fix: {label: Fix it, description: One query with a join; about 20 ms}
          skip: Leave it
          issue: Open an issue for later
      4-pdfs-render:
        type: markdown
        label: 4 · PDFs render inside the request
        text: |-
          `POST /invoices/:id/send` renders the PDF before answering: 2–3 s for a long invoice, and a timeout above ~200 lines.
      f4_pdf_sync:
        type: radio
        label: What should I do?
        required: true
        default: issue
        options:
          fix:
            label: Fix it
            description: Render in a background job and email when ready (half a day of work)
          skip: Leave it
          issue: Open an issue for later
      note:
        type: markdown
        text: |-
          **5 · The invoice table on a phone**

          `InvoiceTable` keeps its five columns below 640 px, so on a phone it scrolls sideways and the status column is off screen.
      f5_mobile_table:
        type: radio
        label: How should it look on a phone?
        required: true
        default: cards
        options:
          table:
            label: 'Leave it: scrolls sideways'
